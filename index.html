<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAFL HUB | ترتيب الدوري</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #00ff87;
            margin-bottom: 20px;
        }
        .table-container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        th {
            background-color: #00ff87;
            color: #000;
            font-weight: bold;
        }
        tr:hover {
            background-color: #2a2a2a;
        }
        .loading {
            color: #aaa;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>🏆 جدول ترتيب دوري NAFL</h1>

    <div class="table-container">
        <table id="standingsTable">
            <thead>
                <tr>
                    <th>الفريق</th>
                    <th>لعب</th>
                    <th>فاز</th>
                    <th>تعادل</th>
                    <th>خسر</th>
                    <th>النقاط</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="6" class="loading">جاري تحميل البيانات الحية...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const sheetId = '1-0nt951oaDYdOdfqVvkTejPhxh_BiCvjn3CMkLE2VgI';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        function fetchLeagueData() {
            fetch(url)
                .then(res => res.text())
                .then(data => {
                    const json = JSON.parse(data.substring(47, data.length - 2));
                    const rows = json.table.rows;
                    const tbody = document.getElementById("tableBody");
                    tbody.innerHTML = ""; 

                    rows.forEach(row => {
                        if (!row.c || !row.c[0]) return;

                        const tr = document.createElement("tr");
                        const team = row.c[0] ? row.c[0].v : '-';
                        const played = row.c[1] ? row.c[1].v : 0;
                        const won = row.c[2] ? row.c[2].v : 0;
                        const draw = row.c[3] ? row.c[3].v : 0;
                        const lost = row.c[4] ? row.c[4].v : 0;
                        const points = row.c[5] ? row.c[5].v : 0;

                        tr.innerHTML = `
                            <td><b>${team}</b></td>
                            <td>${played}</td>
                            <td>${won}</td>
                            <td>${draw}</td>
                            <td>${lost}</td>
                            <td style="color: #00ff87; font-weight: bold;">${points}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error("خطأ في جلب البيانات:", err);
                    document.getElementById("tableBody").innerHTML = `<tr><td colspan="6" style="color:red;">حدث خطأ في جلب البيانات.</td></tr>`;
                });
        }

        fetchLeagueData();
    </script>
</body>
</html>
